name: Release changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Dispatch release pull request checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_branch="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base "$GITHUB_REF_NAME" \
              --label "autorelease: pending" \
              --state open \
              --json headRefName \
              --jq '.[0].headRefName'
          )"
          if [ -n "$release_branch" ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
            gh workflow run quality.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
            gh workflow run catalog-check.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
            gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
          fi

      - name: Dispatch artifact release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
