# Verifies declarative tool and statically reviewed privileged adapter
# contributions, including their mandatory behavior contracts.
name: Catalog check

on:
  pull_request:
    paths:
      - "catalog/**"
      - "privileged-adapters/**"
      - "schemas/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "src/**"
      - "test/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/catalog-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run catalog:check
      - run: bun run privileged:check
      - run: bun test
