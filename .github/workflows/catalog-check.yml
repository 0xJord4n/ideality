# Verifies catalog contributions: manifest validity, unique IDs and
# executables, registry completeness, generated docs freshness, editor schema
# sync, plus the regular typecheck and test suite. No step executes
# contributed code; manifests are parsed as data only.
name: Catalog check

on:
  pull_request:
    paths:
      - "catalog/**"
      - "schemas/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "src/**"
      - "test/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/catalog-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run catalog:check
      - run: bun test
