# Verifies declarative tool and statically reviewed privileged adapter
# contributions, including their mandatory behavior contracts.
name: Catalog check

on:
  pull_request:
    paths:
      - "catalog/**"
      - "privileged-adapters/**"
      - "schemas/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "src/**"
      - "test/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/catalog-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run catalog:check
      - run: bun run privileged:check
      - run: bun test
