name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to rebuild from a corrected workflow
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies (all target platforms)
        run: bun install --frozen-lockfile --os '*' --cpu '*'

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(grep -m1 '"version":' package.json | cut -d '"' -f 4)"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag v$tag_version does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Typecheck and test
        run: bun run check

      - name: Build release archives (Linux/macOS x64/arm64)
        run: bash scripts/build-release.sh

      - name: Rehearse release offline (metadata, checksums, archive layout, binary smoke, installer)
        run: bash scripts/release-rehearsal.sh --no-build

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (Sigstore keyless)
        run: |
          for artifact in dist/release/ideality-*.tar.gz dist/release/SHA256SUMS.txt dist/release/release-metadata.json; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/ideality-*.tar.gz

      - name: Inspect existing GitHub release assets
        id: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          exists=true
          complete=true
          existing="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' 2>/dev/null
          )" || {
            exists=false
            complete=false
          }
          for artifact in dist/release/ideality-*.tar.gz dist/release/SHA256SUMS.txt dist/release/release-metadata.json dist/release/*.sigstore.json; do
            name="${artifact##*/}"
            if ! grep -Fqx -- "$name" <<<"$existing"; then
              complete=false
            fi
          done
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Upload missing GitHub release assets
        if: ${{ steps.release-assets.outputs.exists == 'true' && steps.release-assets.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          existing="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )"
          missing=()
          for artifact in dist/release/ideality-*.tar.gz dist/release/SHA256SUMS.txt dist/release/release-metadata.json dist/release/*.sigstore.json; do
            name="${artifact##*/}"
            if ! grep -Fqx -- "$name" <<<"$existing"; then
              missing+=("$artifact")
            fi
          done
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${missing[@]}"

      - name: Create GitHub release
        if: ${{ steps.release-assets.outputs.exists != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/release/ideality-*.tar.gz
            dist/release/SHA256SUMS.txt
            dist/release/release-metadata.json
            dist/release/release-metadata.json.sigstore.json
            dist/release/*.sigstore.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Publish npm package with provenance
        run: |
          package="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already published; skipping"
          else
            npm publish --access public
          fi
